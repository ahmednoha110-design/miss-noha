<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>لوحة مس نهى</title>
<meta name="theme-color" content="#FFFCFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C0E20" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Admin page for Miss Noha: Clerk sign-in, then her contact messages and reviews from Supabase. Same tokens as index.html. */
  :root {
    --bg: #FFFCFF; --surface: #FFFFFF; --lavender: #EDE2F7; --plum: #57205F; --plum-dark: #40123F;
    --fg: #40123F; --muted: #6E5772; --line: #E3D4EE; --teal: #35AFA0; --teal-ink: #FFFFFF; --error: #B3261E;
    --shadow: 0 6px 24px rgba(87, 32, 95, .10);
    --font-display: "Baloo Bhaijaan 2", "Tajawal", "Segoe UI", Tahoma, sans-serif;
    --font-body: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1C0E20; --surface: #26142B; --lavender: #2F1A35; --plum: #E2B8EA; --plum-dark: #F6EAF8;
      --fg: #F6EAF8; --muted: #CDB5D3; --line: #432A4A; --teal: #4CC7B7; --teal-ink: #0E2A26; --error: #FFB4AB;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35); color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.7; }
  h1, h2 { font-family: var(--font-display); color: var(--plum); margin: 0; line-height: 1.3; }
  :focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 6px; }
  .wrap { max-width: 960px; margin-inline: auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 20px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  header h1 { font-size: 1.6rem; }
  .muted { color: var(--muted); }
  #sign-in { display: grid; justify-items: center; gap: 16px; padding-block: 24px; }
  .notice { background: var(--surface); border: 2px dashed var(--line); border-radius: 16px; padding: 16px 18px; display: grid; gap: 8px; }
  .notice code { direction: ltr; unicode-bidi: isolate; background: var(--lavender); padding: 2px 8px; border-radius: 8px; user-select: all; word-break: break-all; }
  .tabs { display: flex; gap: 8px; margin-block: 16px; flex-wrap: wrap; }
  .tabs button { font: inherit; font-weight: 700; padding: 8px 18px; border-radius: 999px; border: 2px solid var(--plum); background: none; color: var(--plum); cursor: pointer; min-height: 44px; }
  .tabs button[aria-selected="true"] { background: var(--plum); color: var(--bg); }
  .list { display: grid; gap: 12px; list-style: none; padding: 0; margin: 0; }
  .item { background: var(--surface); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); display: grid; gap: 6px; }
  .item .top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; }
  .item strong { color: var(--plum-dark); }
  .item .meta { color: var(--muted); font-size: .92rem; }
  .item .phone { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  .item .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .pill { font-size: .85rem; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: var(--lavender); color: var(--plum); }
  .pill.ok { color: var(--teal); }
  .error { color: var(--error); font-weight: 700; }
</style>

<div class="wrap">
  <header>
    <h1>لوحة مس نهى</h1>
    <div id="user-button"></div>
  </header>

  <main>
    <p id="status" class="muted" role="status">بيحمّل…</p>

    <section id="sign-in" hidden aria-label="تسجيل الدخول">
      <p class="muted">سجّلي دخول علشان تشوفي الرسايل والآراء.</p>
      <div id="clerk-sign-in"></div>
    </section>

    <section id="admin" hidden>
      <div class="tabs" role="tablist" aria-label="الأقسام">
        <button type="button" role="tab" id="tab-messages" aria-controls="panel" aria-selected="true">رسايل التواصل</button>
        <button type="button" role="tab" id="tab-feedback" aria-controls="panel" aria-selected="false">آراء أولياء الأمور</button>
      </div>
      <div id="panel" role="tabpanel" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
  // Clerk (sign-in) and Supabase (data). Both keys are publishable, safe in the page.
  // Supabase only returns rows when the Clerk session token is accepted (third-party auth)
  // and RLS lets this Clerk user id read; everyone else still can only insert.
  var CLERK_PUBLISHABLE_KEY = 'pk_test_b3B0aW1hbC1oZW4tOTUxNi5jbGVyay5hY2NvdW50cy5kZXYk';
  var CLERK_FRONTEND_API = 'https://optimal-hen-9516.clerk.accounts.dev';
  var SUPABASE_URL = 'https://dzixyjhawkncxztvqmxn.supabase.co';
  var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_rGDyWDQi3g5XhD017GlZ5g_f0Q-Huet';

  var TABLES = {
    messages: { tab: 'tab-messages', empty: 'لسه مفيش رسايل.' },
    feedback: { tab: 'tab-feedback', empty: 'لسه مفيش آراء.' }
  };

  function byId(id) { return document.getElementById(id); }
  function setStatus(text) { byId('status').textContent = text; byId('status').hidden = !text; }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  var dateFmt = new Intl.DateTimeFormat('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });

  function renderRow(table, row) {
    var li = el('li', 'item');
    var top = el('div', 'top');
    top.appendChild(el('strong', null, row.name));
    top.appendChild(el('span', 'meta', dateFmt.format(new Date(row.created_at))));
    li.appendChild(top);
    if (table === 'messages') {
      li.appendChild(el('span', 'meta phone', row.phone));
    } else {
      var meta = el('div', 'top');
      meta.appendChild(el('span', 'meta', row.grade ? 'الصف: ' + row.grade : 'من غير صف'));
      meta.appendChild(el('span', row.allow_publish ? 'pill ok' : 'pill', row.allow_publish ? 'موافق على النشر' : 'مش للنشر'));
      li.appendChild(meta);
    }
    li.appendChild(el('p', 'msg', row.message));
    return li;
  }

  function showSetupNotice(panel, why) {
    var box = el('div', 'notice');
    box.appendChild(el('strong', null, why));
    box.appendChild(el('p', 'muted', 'ابعتي رقم الحساب ده للي بيظبط الموقع علشان يتضاف لصلاحيات Supabase:'));
    box.appendChild(el('code', null, window.Clerk.user.id));
    panel.appendChild(box);
  }

  async function loadTable(table) {
    Object.keys(TABLES).forEach(function (t) {
      byId(TABLES[t].tab).setAttribute('aria-selected', String(t === table));
    });
    var panel = byId('panel');
    panel.replaceChildren(el('p', 'muted', 'بيحمّل…'));

    var token = await window.Clerk.session.getToken();
    var res;
    try {
      res = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?select=*&order=created_at.desc', {
        headers: { 'apikey': SUPABASE_PUBLISHABLE_KEY, 'Authorization': 'Bearer ' + token }
      });
    } catch (e) {
      panel.replaceChildren(el('p', 'error', 'مش قادرين نوصل لـ Supabase دلوقتي. جرّبي تاني بعد شوية.'));
      return;
    }
    panel.replaceChildren();
    if (res.status === 401 || res.status === 403) {
      showSetupNotice(panel, 'Supabase لسه مش قابل دخولك بـ Clerk، أو لسه مفيش صلاحية قراية لحسابك.');
      return;
    }
    if (res.status === 404) {
      panel.appendChild(el('p', 'error', 'الجدول ده لسه مش موجود في Supabase.'));
      return;
    }
    if (!res.ok) {
      panel.appendChild(el('p', 'error', 'حصلت مشكلة في التحميل (' + res.status + ').'));
      return;
    }
    var rows = await res.json();
    if (!rows.length) {
      // An empty list can also mean RLS filtered everything out for this user.
      panel.appendChild(el('p', 'muted', TABLES[table].empty));
      showSetupNotice(panel, 'لو متأكدة إن فيه بيانات ومش ظاهرة، يبقى حسابك لسه مش متضاف لصلاحيات القراية.');
      return;
    }
    var list = el('ul', 'list');
    rows.forEach(function (row) { list.appendChild(renderRow(table, row)); });
    panel.appendChild(list);
  }

  async function start() {
    try {
      await window.Clerk.load();
    } catch (e) {
      setStatus('مش قادرين نحمّل تسجيل الدخول دلوقتي. جرّبي تاني بعد شوية.');
      return;
    }
    if (!window.Clerk.user) {
      setStatus('');
      byId('sign-in').hidden = false;
      window.Clerk.mountSignIn(byId('clerk-sign-in'), { forceRedirectUrl: location.href });
      return;
    }
    setStatus('');
    window.Clerk.mountUserButton(byId('user-button'));
    byId('admin').hidden = false;
    Object.keys(TABLES).forEach(function (t) {
      byId(TABLES[t].tab).addEventListener('click', function () { loadTable(t); });
    });
    loadTable('messages');
  }

  // Clerk's browser bundle, served from this app's own Clerk frontend API (major version pinned).
  var script = document.createElement('script');
  script.src = CLERK_FRONTEND_API + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
  script.async = true;
  script.crossOrigin = 'anonymous';
  script.setAttribute('data-clerk-publishable-key', CLERK_PUBLISHABLE_KEY);
  script.onload = start;
  script.onerror = function () { setStatus('مش قادرين نحمّل تسجيل الدخول دلوقتي. جرّبي تاني بعد شوية.'); };
  document.head.appendChild(script);
</script>
</html>
