<title>Miss Noha QR</title>

<style>
  /* 1080×1350 portrait card (prints as 4:5, posts as Instagram portrait). Brand: plum on lavender. */
  :root {
    --plum: #57205F;
    --plum-dark: #40123F;
    --lavender: #EDE2F7;
    --white: #FFFFFF;
    --teal: #35AFA0;
    --muted: #6E5772;
    --font-display: "Baloo Bhaijaan 2", "Tajawal", "Segoe UI", Tahoma, sans-serif;
    --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    background: var(--lavender);
    color: var(--plum-dark);
    font-family: var(--font-body);
    display: flex; flex-direction: column; align-items: center;
    padding: 64px 72px 56px;
    position: relative;
  }
  /* Plum band behind the portrait */
  body::before {
    content: ""; position: absolute; inset: 0 0 auto; height: 300px;
    background: var(--plum);
    border-radius: 0 0 50% 50% / 0 0 80px 80px;
  }
  .portrait {
    position: relative; width: 260px; height: 260px; border-radius: 50%;
    border: 10px solid var(--white); overflow: hidden; box-shadow: 0 12px 32px rgba(64, 18, 63, .25);
    background: var(--white);
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; transform: scale(1.35); transform-origin: 50% 22%; }
  .name {
    margin-top: 22px; font-family: var(--font-display); font-weight: 800; font-size: 104px; line-height: 1;
    color: var(--plum); direction: ltr; letter-spacing: -.01em;
  }
  .name-ar { font-family: var(--font-display); font-weight: 700; font-size: 50px; line-height: 1.3; color: var(--plum-dark); margin-top: 6px; }
  .role {
    margin-top: 14px; display: flex; gap: 14px; align-items: center;
    font-weight: 700; font-size: 28px; color: var(--plum);
  }
  .role .en { direction: ltr; font-family: var(--font-display); font-weight: 700; background: var(--white); padding: 2px 20px; border-radius: 999px; }
  .card {
    margin-top: 34px; background: var(--white); border-radius: 44px; padding: 36px 36px 28px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: 0 16px 40px rgba(64, 18, 63, .14);
  }
  .qr { width: 440px; height: 440px; display: block; shape-rendering: crispEdges; }
  .scan { font-family: var(--font-display); font-weight: 700; font-size: 38px; color: var(--plum); line-height: 1.2; }
  .foot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .wa { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 800; font-size: 40px; color: var(--plum-dark); direction: ltr; }
  .wa svg { width: 40px; height: 40px; color: var(--teal); }
  .where { font-size: 26px; font-weight: 500; color: var(--muted); }
</style>
